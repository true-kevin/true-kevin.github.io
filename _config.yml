# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

lang: ko

# Change to your timezone › https://zones.arilyn.cc
timezone: Asia/Seoul

# jekyll-seo-tag settings › https://github.com/jekyll/jekyll-seo-tag/blob/master/docs/usage.md
# ↓ --------------------------

title: 개발자 김점심

tagline: "Jekyll & GitHub Pages<br/>블로그 만들기"

description: >-
  Jekyll과 GitHub Pages로 블로그를 처음부터 만들고 운영하는 과정을 기록하는 개발 블로그입니다.

# 커스텀 도메인 연결 전이므로 우선 기본 GitHub Pages 주소로 설정
# 나중에 도메인 연결하면 이 값을 바꿔야 함 (예: https://mysite.com)
url: "https://orotamia.com"

# github:
#   username: 

twitter:
  username: # 트위터 없으면 비워두세요 (UI에 자동으로 안 뜸)

social:
  name:
  email: "jeomsimg530@gmail.com"           # ← 직접 입력, 개인정보처리방침에도 노출됨
  fediverse_handle:
  links:

# Site Verification Settings
webmaster_verifications:
  google:   # Search Console 등록 시 발급되는 코드, 등록 후 채우기
  bing:
  alexa:
  yandex:
  baidu:
  facebook:

# ↑ --------------------------
# The end of `jekyll-seo-tag` settings

# Web Analytics Settings
analytics:
  google:
    id: # Google Analytics 나중에 붙이고 싶으면 채우기 (필수 아님)
  goatcounter:
    id:
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id:
  fathom:
    id:

pageviews:
  provider:

theme_mode: # 비워두면 시스템 설정 따라감 (추천)

cdn:

avatar: "/assets/img/avatar.png"

social_preview_image:

toc: true

actions:
  edit_post:
    enabled: false
    url: ""
    static_url: false

comments:
  provider: # 댓글 원하면 disqus/utterances/giscus 중 선택, 지금은 비워도 무방
  disqus:
    shortname:
  utterances:
    repo:
    issue_term:
  giscus:
    repo:
    repo_id:
    category:
    category_id:
    mapping:
    strict:
    input_position:
    lang:
    reactions_enabled:

assets:
  self_host:
    enabled:
    env:

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:

paginate: 10

baseurl: ""

# ------------ The following options are not recommended to be modified ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
